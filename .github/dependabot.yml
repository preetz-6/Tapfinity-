version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # Group minor + patch bumps into a single PR to reduce noise
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Don't auto-bump major versions — those need manual review
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
